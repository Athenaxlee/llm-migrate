name: Bug report
description: Report a reproducible problem in llm-migrate.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no credentials, private prompts, or customer data.
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [MCP, CLI, Python API, Registry, Evaluation, Other]
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide sanitized commands, fixture code, or artifact structure.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation method, and relevant provider/platform names.
    validations:
      required: true
