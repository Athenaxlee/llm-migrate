name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Test
        run: pytest

      - name: Validate checked-in proposal bundles
        run: pytest tests/unit/test_checked_in_proposals.py

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

  windows:
    # The field host runs on Windows: path resolution, scanning, prompt
    # discovery, and the run-state lock must hold there too.
    runs-on: windows-latest
    steps:
      - name: Keep fixture line endings byte-identical to the goldens
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Resolution, scanner, discovery, and run-state suites
        run: >-
          pytest tests/unit/test_v160a_prompt_discovery.py
          tests/unit/test_v160b_actionable_unknowns.py
          tests/unit/test_prompt_discovery.py
          tests/unit/test_application_scanner.py
          tests/unit/test_runstate.py
