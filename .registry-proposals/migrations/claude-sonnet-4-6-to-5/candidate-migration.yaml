schema_version: "1"
id: claude-sonnet-4-6-to-5
source_model: claude-sonnet-4-6
target_model: claude-sonnet-5
checked_at: 2026-09-23
changes:
  - field_path: parameters.thinking
    statement: Manual extended thinking is removed and returns HTTP 400 on Sonnet 5.
    severity: breaking
    recommended_action: Use adaptive thinking with the effort parameter.
    supporting_sources: [anthropic-sonnet-5-migration-2026-08-08]
  - field_path: parameters.sampling
    statement: Non-default temperature, top_p, or top_k values return HTTP 400 on Sonnet 5.
    severity: breaking
    recommended_action: Remove non-default sampling parameters and use prompt instructions.
    supporting_sources: [anthropic-sonnet-5-migration-2026-08-08]
  - field_path: reasoning.default
    statement: Adaptive thinking is on by default on Sonnet 5.
    severity: high
    recommended_action: Revisit max_tokens and explicitly disable thinking when appropriate.
    supporting_sources: [anthropic-sonnet-5-migration-2026-08-08]
  - field_path: tokenizer
    statement: The same input text produces approximately 30 percent more tokens than on Sonnet 4.6.
    severity: high
    recommended_action: Recount prompts and revisit context, output, and cost budgets.
    supporting_sources: [anthropic-sonnet-5-migration-2026-08-08]
  - field_path: prompt_guidance.sampling_instructions
    statement: Sonnet 5 rejects non-default temperature, top_p, and top_k; Anthropic's documented replacement is to guide model behavior with system-prompt instructions.
    severity: medium
    recommended_action: Where the application relied on a sampling setting to shape output, state the intended behavior explicitly in the system prompt instead of carrying the parameter forward.
    applies_when: sampling
    supporting_sources: [anthropic-sonnet-5-migration-2026-08-08, anthropic-sonnet-5-migration-guide-2026-09-23]
  - field_path: prompt_guidance.token_counts
    statement: The Sonnet 5 tokenizer produces approximately 30 percent more tokens for the same prompt text; Anthropic directs re-running token counting against Sonnet 5 rather than reusing counts measured on earlier models.
    severity: medium
    recommended_action: Recount each prompt's tokens against Sonnet 5 and revisit prompt-length and max_tokens budgets sized close to their limits.
    supporting_sources: [anthropic-sonnet-5-migration-2026-08-08, anthropic-sonnet-5-migration-guide-2026-09-23]
sources:
