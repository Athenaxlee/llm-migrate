claims:
- id: sonnet-5-sampling-prompt-replacement
  field_path: prompt_guidance.sampling_instructions
  statement: Sonnet 5 returns a 400 error for non-default temperature, top_p, or top_k; the official
    guidance is to remove them and use system-prompt instructions to guide model behavior.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-whats-new-2026-09-23
  - anthropic-sonnet-5-migration-guide-2026-09-23
- id: sonnet-5-prompt-token-recount
  field_path: prompt_guidance.token_counts
  statement: The new Sonnet 5 tokenizer produces approximately 30 percent more tokens for the same
    text; the official migration checklist says to re-run token counting against Sonnet 5 rather
    than reusing counts measured against earlier models.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-whats-new-2026-09-23
  - anthropic-sonnet-5-migration-guide-2026-09-23
- id: sonnet-5-existing-pair-facts-reverified
  field_path: changes
  statement: The existing pair facts (manual thinking returns 400, non-default sampling returns 400,
    adaptive thinking on by default, approximately 30 percent more tokens) are restated by both
    official pages.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-whats-new-2026-09-23
  - anthropic-sonnet-5-migration-guide-2026-09-23
