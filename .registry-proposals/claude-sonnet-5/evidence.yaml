schema_version: '1'
subject: claude-sonnet-5
canonical_model_candidate: claude-sonnet-5
research_date: 2026-08-09
claims:
- id: sonnet-5-pricing-base-2026-09-23
  field_path: pricing
  value: {input: "2", output: "10"}
  statement: The models overview, the Sonnet 5 launch page, and the Sonnet 5 migration guide, all refetched
    2026-09-23, state $2 / $10 per million tokens as the base price with no introductory period or
    expiry; the earlier introductory framing (valid until 2026-08-31, standard $3 / $15 after) no
    longer appears in any official source.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-models-overview-2026-09-23
  action: set
- id: sonnet-5-context
  field_path: capabilities.context_window_tokens
  value: 1000000
  statement: Anthropic and AWS specify a 1M-token context window.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-models-overview-2026-08-08
  - anthropic-sonnet-5-new-2026-08-08
  - aws-sonnet-5-card-2026-08-08
- id: sonnet-5-output
  field_path: capabilities.maximum_output_tokens
  value: 128000
  statement: Anthropic and AWS specify a 128K-token maximum output.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-models-overview-2026-08-08
  - anthropic-sonnet-5-new-2026-08-08
  - aws-sonnet-5-card-2026-08-08
- id: sonnet-5-temperature
  field_path: parameters.temperature.state
  value: unsupported
  statement: Non-default temperature values return HTTP 400.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-new-2026-08-08
- id: sonnet-5-top-p
  field_path: parameters.top_p.state
  value: unsupported
  statement: Non-default top_p values return HTTP 400.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-new-2026-08-08
- id: sonnet-5-top-k
  field_path: parameters.top_k.state
  value: unsupported
  statement: Non-default top_k values return HTTP 400.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-new-2026-08-08
- id: sonnet-5-manual-thinking
  field_path: parameters.thinking.state
  value: unsupported
  statement: Manual extended thinking returns HTTP 400; adaptive thinking with effort replaces it.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-new-2026-08-08
- id: sonnet-5-disable-anthropic
  field_path: parameters.adaptive_thinking.disable_supported
  value: true
  statement: Anthropic says thinking can be disabled with thinking.type disabled.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-sonnet-5-new-2026-08-08
  notes: Scoped to the Anthropic API documentation.
- id: sonnet-5-disable-bedrock
  field_path: parameters.adaptive_thinking.disable_supported
  value: false
  statement: The AWS model card says adaptive thinking is always on and cannot be disabled.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - aws-sonnet-5-card-2026-08-08
  notes: Scoped to Amazon Bedrock.
- id: claude-sonnet-5-bedrock-invocation
  field_path: platforms.amazon-bedrock.invocation
  value:
    bare_on_demand_supported: false
    selectors:
    - name: us
      model_id: us.anthropic.claude-sonnet-5
    - name: eu
      model_id: eu.anthropic.claude-sonnet-5
    - name: au
      model_id: au.anthropic.claude-sonnet-5
    - name: global
      model_id: global.anthropic.claude-sonnet-5
  statement: On-demand Bedrock invocation requires a cross-region inference-profile id; the bare model
    id is not invocable on demand.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - aws-inference-profiles-2026-09-22
- id: claude-sonnet-5-api-invocation
  field_path: platforms.anthropic-api.invocation
  value:
    bare_on_demand_supported: true
  statement: The Anthropic API invokes the model directly by its model id.
  kind: fact
  evidence_type: direct
  confidence: authoritative
  sources:
  - anthropic-models-invocation-2026-09-22
