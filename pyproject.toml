[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-migrate"
version = "1.6.0"
description = "Local-first, provider-neutral LLM application migration toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "llm-migrate contributors" }]
keywords = ["llm", "migration", "mcp", "agents", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=2.0,<5",
  "jsonschema>=4.22,<5",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<3",
  "pytest>=8.2,<10",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.22",
  "types-PyYAML>=6.0,<7",
]
aws = ["boto3>=1.35,<2"]

[project.urls]
Homepage = "https://github.com/Athenaxlee/llm-migrate"
Documentation = "https://github.com/Athenaxlee/llm-migrate#readme"
Repository = "https://github.com/Athenaxlee/llm-migrate.git"
Issues = "https://github.com/Athenaxlee/llm-migrate/issues"
Changelog = "https://github.com/Athenaxlee/llm-migrate/releases"

[project.scripts]
llm-migrate = "llm_migrate.cli.main:app"
llm-migrate-mcp = "llm_migrate.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_migrate"]

[tool.hatch.build.targets.wheel.shared-data]
registry = "share/llm-migrate/registry"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_migrate"]
